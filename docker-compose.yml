#version: '3.8'

services:
  # ========== Nginx 反向代理 ==========
  nginx:
    image: nginx:alpine
    container_name: inference-nginx
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - gateway
    networks:
      - inference-net
    restart: unless-stopped

  # ========== FastAPI 网关 ==========
  gateway:
    build:
      context: .
      dockerfile: ./docker/Dockerfile
    container_name: inference-gateway
    ports:
      - "8000:8000"
    environment:
      - VLLM_BACKEND_URL=http://vllm:8001/v1/chat/completions
      - LLAMA_BACKEND_URL=http://llama:8002/v1/chat/completions
    depends_on:
      - vllm
      - llama
    networks:
      - inference-net
    restart: unless-stopped

  # ========== vLLM 推理引擎 ==========
  vllm:
    image: vllm/vllm-openai:latest
    container_name: inference-vllm
    ports:
      - "8001:8001"
    command:
      - "--model"
      - "/models/Qwen2.5-3B-Instruct-GPTQ-Int4"
      - "--gpu-memory-utilization"
      - "0.85"
      - "--port"
      - "8001"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - inference-net
    restart: unless-stopped

  # ========== llama.cpp 推理引擎 ==========
  llama:
    image: ghcr.io/ggml-org/llama.cpp:full-cuda
    container_name: inference-llama
    ports:
      - "8002:8002"
    volumes:
      - ~/projects/llama.cpp/models:/models
    command:
      - "--server"
      - "-m"
      - "/models/llama-2-7b-chat.Q4_K_M.gguf"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8002"
      - "--n-gpu-layers"
      - "99"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - inference-net
    restart: unless-stopped

networks:
  inference-net:
    driver: bridge